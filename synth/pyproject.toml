[project]
name = "turnsynth"
version = "0.1.0"
description = "Synthetic TurnBench-format turn-taking data: LLM scripts, TTS rendering, triple annotation."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=15",
    "soundfile>=0.12",
]

[project.optional-dependencies]
llm = ["anthropic>=0.60"]
tts = ["kokoro==0.9.4", "torch>=2.4,<2.8"]
asr = ["faster-whisper>=1.1"]
cjk = ["pykakasi>=2.3", "pypinyin>=0.50"]  # forced alignment of Japanese / Chinese words
# The official scorer and gold code, pinned to the commit the VAP baseline uses.
score = ["turnbench @ git+https://github.com/SesameAILabs/turnbench@38a6f874322430cb3ca71d8a52aa1e636e88bad8"]
dev = ["pytest>=8"]

[project.scripts]
turnsynth = "turnsynth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turnsynth"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
